name: Send Approval Email via Gmail

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  send-email:
    runs-on: ubuntu-latest
    steps:
      - name: Send mail
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USER }}
          password: ${{ secrets.EMAIL_PASS }}
          subject: "Jamia Website Update Review - Pull Request #${{ github.event.number }}"
          to: ${{ secrets.ADMIN_EMAIL }}
          from: "Jamia Rushd-ul-Eman Updates <${{ secrets.EMAIL_USER }}>"
          body: |
            Assalam-o-Alaikum Sir,

            Jamia Rushd-ul-Eman & Education Center ki website ke new content/image updates review ke liye ready hain.

            Pull Request Link: ${{ github.event.pull_request.html_url }}
            
            Shukriya!
