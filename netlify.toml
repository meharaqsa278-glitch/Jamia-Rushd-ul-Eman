# Netlify Configuration for Jamia Rushd-ul-Eman & Education Center

[build]
  # The command to build the production Vite bundle
  command = "npm run build"
  
  # The directory containing the production build files to be deployed
  publish = "dist"

# Default environment variable fallbacks for Supabase (can also be set in Netlify UI)
[build.environment]
  NODE_VERSION = "20"
  VITE_SUPABASE_URL = "https://xowpbzwnwrpfuregppcu.supabase.co"
  VITE_SUPABASE_ANON_KEY = "sb_publishable_jjReSMMXsHybxwAclVxG_w_8GE8IwcD"

# SPA Fallback: Redirect all routes to index.html with HTTP status 200
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security and caching headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Long-term cache headers for hashed Vite static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
